<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AIMS English — IELTS Partial Test Booking</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin />
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
  <!-- Optional SheetJS for Multi-Sheet .xlsx Export (graceful CSV fallback built-in if offline) #Monsur -->
  <script defer src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #e2e8f0;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 0;
    }
    @media (min-width: 640px) {
      body { padding: 20px 16px; }
    }

    /* App Shell #Monsur*/
    #app-shell {
      width: 100%;
      max-width: 448px;
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 14px 44px -12px rgba(7, 20, 25, 0.22);
    }
    @media (min-width: 640px) {
      #app-shell {
        min-height: 840px;
        max-height: 920px;
        border-radius: 32px;
      }
    }

    /* Header */
    .app-header {
      background-color: #071419;
      color: #ffffff;
      padding: 14px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      border-bottom: 1px solid rgba(19, 78, 74, 0.6);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand-slot {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .brand-logo-img {
      height: 40px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .sync-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 11px;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      display: inline-block;
    }
    .dot-emerald { background-color: #34d399; }
    .dot-amber { background-color: #fbbf24; }
    .dot-slate { background-color: #94a3b8; }

    .btn-icon {
      padding: 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .btn-icon:hover { background: rgba(255, 255, 255, 0.2); }

    .header-subbar {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .subbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #99f6e4;
      font-weight: 500;
    }
    .subbar-gold {
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 10px;
      color: #DDA73C;
      font-weight: 700;
    }
    .mode-badge-student {
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(10, 108, 130, 0.45);
      color: #ccfbf1;
      font-weight: 600;
    }
    .mode-badge-admin {
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(221, 167, 60, 0.25);
      color: #DDA73C;
      font-weight: 700;
    }

    /* Main Scroll Area */
    #main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Cards & Layout Helpers */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      border: 1px solid rgba(226, 232, 240, 0.9);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-dark {
      background: #071419;
      color: #ffffff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(19, 78, 74, 0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-kicker {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .helper-text {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
    }
    .input, .select {
      width: 100%;
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 500;
      color: #0f172a;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input:focus, .select:focus {
      border-color: #0A6C82;
      box-shadow: 0 0 0 3px rgba(10, 108, 130, 0.18);
      background-color: #ffffff;
    }
    .select {
      font-weight: 700;
      cursor: pointer;
    }
    .input-sm, .select-sm {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #0f172a;
      font-family: inherit;
      outline: none;
      width: 100%;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.1s, background 0.15s;
    }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-full { width: 100%; }
    .btn-teal { background-color: #0A6C82; color: #ffffff; box-shadow: 0 4px 12px rgba(10, 108, 130, 0.25); }
    .btn-teal:hover { opacity: 0.94; }
    .btn-dark { background-color: #071419; color: #ffffff; }
    .btn-dark:hover { background-color: #0f172a; }
    .btn-emerald { background-color: #059669; color: #ffffff; }
    .btn-emerald:hover { background-color: #047857; }
    .btn-rose { background-color: #e11d48; color: #ffffff; }
    .btn-rose:hover { background-color: #be123c; }
    .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 10px; }
    .btn-xs { padding: 5px 10px; font-size: 11px; border-radius: 8px; }

    /* Student Top Nav Strip */
    .student-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #ffffff;
      padding: 6px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .student-nav-pill {
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .student-nav-pill.active {
      background: #0A6C82;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(10, 108, 130, 0.25);
    }
    .student-nav-pill.inactive {
      background: #f1f5f9;
      color: #334155;
    }
    .student-nav-pill.inactive:hover {
      background: #e2e8f0;
    }

    /* Quota Preview Box #Monsur*/
    .quota-box {
      margin-top: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quota-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .quota-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .quota-cell {
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      padding: 6px 4px;
      text-align: center;
    }
    .quota-cell.warn { background: #fffbeb; border-color: #fde68a; color: #b45309; }
    .quota-cell.zero { background: #fff1f2; border-color: #fecdd3; color: #be123c; }

    /* Module Cards & Slot Buttons */
    .module-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .module-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .module-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .mod-Speaking .module-icon { background: #f5f3ff; color: #7c3aed; border-color: #ddd6fe; }
    .mod-Reading .module-icon { background: #ecfdf5; color: #059669; border-color: #a7f3d0; }
    .mod-Listening .module-icon { background: #f0f9ff; color: #0284c7; border-color: #bae6fd; }
    .mod-Writing .module-icon { background: #fffbeb; color: #d97706; border-color: #fde68a; }

    .slot-btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .slot-btn:hover { border-color: #94a3b8; }
    .slot-btn.full {
      background: #f1f5f9;
      opacity: 0.65;
      cursor: not-allowed;
    }
    .slot-btn.picked-Speaking { border-color: #8b5cf6; background: #f5f3ff; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); }
    .slot-btn.picked-Reading { border-color: #10b981; background: #ecfdf5; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
    .slot-btn.picked-Listening { border-color: #0ea5e9; background: #f0f9ff; box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2); }
    .slot-btn.picked-Writing { border-color: #f59e0b; background: #fffbeb; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }

    .seat-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 9999px;
      background: #f1f5f9;
      color: #475569;
    }
    .seat-pill.picked { background: #071419; color: #ffffff; }
    .seat-pill.full { background: #ffe4e6; color: #be123c; }

    /* Management Tabs & Grids #Monsur*/
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .kpi-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px;
    }
    .tab-bar {
      background: #ffffff;
      padding: 6px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      padding: 8px 4px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      font-family: inherit;
    }
    .tab-btn.active {
      background: #0A6C82;
      color: #ffffff;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .flex-wrap { display: flex; flex-wrap: wrap; gap: 6px; }

    .list-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .chip-batch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      color: #1e293b;
    }
    .chip-toggle {
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #94a3b8;
      cursor: pointer;
      font-family: inherit;
    }
    .chip-toggle.on {
      background: #0A6C82;
      color: #ffffff;
      border-color: #0A6C82;
    }

    /* Footer */
    .app-footer {
      background: #f1f5f9;
      border-top: 1px solid #e2e8f0;
      padding: 12px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .footer-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }
    .footer-btn.in-admin {
      background: #071419;
      color: #ffffff;
      border-color: #071419;
    }
    .copyright {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }

    /* Center-Screen Notification Overlay & Modal */
    #toast-container {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 70;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 10px;
    }
    @keyframes popCenter {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }
    .toast {
      pointer-events: auto;
      padding: 16px 20px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      color: #ffffff;
      box-shadow: 0 20px 45px rgba(7, 20, 25, 0.38);
      max-width: 340px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      animation: popCenter 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .toast-badge {
      font-size: 20px;
      line-height: 1;
    }
    .toast-success { background: #071419; border: 2px solid #10b981; }
    .toast-error { background: #9f1239; border: 2px solid #fda4af; }
    .toast-info { background: #0A6C82; border: 2px solid #5eead4; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.58);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.hidden { display: none; }
    .modal-card {
      background: #ffffff;
      border-radius: 18px;
      width: 100%;
      max-width: 320px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    /* SVG & Animations */
    svg { width: 16px; height: 16px; flex-shrink: 0; }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin-fast { animation: spinSlow 0.75s linear infinite; }
  </style>
</head>
<body>

  <!-- Mobile App Shell -->
  <div id="app-shell">

    <!-- Top Brand Header -->
    <header class="app-header">
      <div class="header-top">
        <div id="brand-logo-slot" class="brand-slot"></div>

        <div class="header-actions">
          <div id="sync-pill" class="sync-pill">
            <span id="sync-dot" class="dot dot-emerald"></span>
            <span id="sync-text">Live Sync</span>
          </div>

          <button
            type="button"
            onclick="handleManualSync()"
            title="Refresh Live Data"
            class="btn-icon"
          >
            <svg id="sync-icon" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Week & Portal Bar -->
      <div class="header-subbar">
        <div class="subbar-left">
          <span class="subbar-gold">IELTS Partial Test</span>
          <span>•</span>
          <span id="header-week-label" style="color:#fff;font-weight:600;">Current Week</span>
        </div>
        <span id="header-mode-tag" class="mode-badge-student">Student Portal</span>
      </div>
    </header>

    <!-- Scrollable Main Area -->
    <main id="main-content"></main>

    <!-- Footer -->
    <footer class="app-footer">
      <div>
        <button
          id="footer-portal-btn"
          type="button"
          onclick="handleFooterPortalClick()"
          class="footer-btn"
        >
          🔒 Teacher / Management Portal
        </button>
      </div>
      <p class="copyright">© M Monsur Islam</p>
    </footer>

    <!-- Center-Screen Notification Container -->
    <div id="toast-container"></div>

    <!-- Custom Confirm Modal #Monsur-->
    <div id="confirm-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <h3 id="modal-title" style="font-size:14px;font-weight:700;color:#0f172a;">Confirm Action</h3>
        <p id="modal-message" style="font-size:12px;color:#64748b;margin-top:6px;line-height:1.5;">Are you sure?</p>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
          <button
            id="modal-cancel-btn"
            type="button"
            class="btn btn-sm"
            style="background:#f1f5f9;color:#475569;"
          >
            Cancel
          </button>
          <button
            id="modal-confirm-btn"
            type="button"
            class="btn btn-sm btn-rose"
          >
            Confirm
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    /*************************************************************************
     * 1. CONFIGURATION & DEFAULTS (FIXED 4 PER MODULE / 16 TOTAL + 1/WEEK)
     *************************************************************************/
    const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytDKacdwD02spqX6U-X46yqZFeSb1SeKH0o7f6NNWEL9T694qz_PkyJHLN1K6acgE/exec';
    const DEFAULT_LOGO_PATH = 'https://lh3.googleusercontent.com/d/1CT0IGBYQjnHEg_Xl_Sg97bOB2kwWkQNw';

    const STORAGE_URL_KEY = 'aims_up_script_url_v5';
    const STORAGE_DEMO_KEY = 'aims_up_demo_data_v5';
    const STORAGE_LIVE_CACHE_KEY = 'aims_up_live_cache_v5';
    const STORAGE_PW_KEY = 'aims_up_local_pw_v5';
    const STORAGE_LOGO_KEY = 'aims_up_custom_logo_v5';
    const STORAGE_STUDENT_SESSION_KEY = 'aims_up_student_session_v5';

    const ALL_MODULE_KEYS = ['Speaking', 'Reading', 'Listening', 'Writing'];
    const DEFAULT_BATCHES = ['198', '199', '203', '204', '207', '208', '209', '210', 'APU', 'ASB'];
    const MAX_PER_MODULE = 4;
    const MAX_TOTAL_MODULES = 16;
    const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const DEFAULT_BOOKING_WINDOW = {
      enabled: true,
      startDate: '2026-11-22',
      startTime: '15:00',
      endDate: '2026-11-22',
      endTime: '23:00'
    };

    const MODULE_META = {
      Speaking: {
        subtitle: '20-min individual slot (max 2 students/slot)',
        icon: `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>`
      },
      Reading: {
        subtitle: 'Group partial session (15 seats)',

    /*************************************************************************
     * 2. HELPERS & NORMALIZATION
     *************************************************************************/
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeMobileKey(raw) {
      const digits = String(raw || '').replace(/\D/g, '');
      if (!digits) return '';
      return digits.length >= 11 ? digits.slice(-11) : digits;
    }

    function computeMobileQuotaMap(archiveList = [], bookingList = []) {
      const map = {};
      const record = (item) => {
        const key = normalizeMobileKey(item.mobileNumber);
        if (!key) return;
        if (!map[key]) {
          map[key] = {
            mobileKey: key,
            mobileDisplay: String(item.mobileNumber || '').trim(),
            studentName: String(item.studentName || '').trim(),
            batch: String(item.batch || '').trim(),
            Speaking: 0,
            Reading: 0,
            Listening: 0,
            Writing: 0,
            totalUsed: 0
          };
        }
        if (item.studentName) map[key].studentName = String(item.studentName).trim();
        if (item.batch) map[key].batch = String(item.batch).trim();
        if (ALL_MODULE_KEYS.includes(item.module)) {
          map[key][item.module] += 1;
          map[key].totalUsed += 1;
        }
      };
      archiveList.forEach(record);
      bookingList.forEach(record);
      return map;
    }

    function hasBookedThisWeek(mobileRaw) {
      const key = normalizeMobileKey(mobileRaw);
      if (!key) return false;
      return appState.bookings.some(b => normalizeMobileKey(b.mobileNumber) === key);
    }

    function getStudentMobileUsage(mobileRaw) {
      const key = normalizeMobileKey(mobileRaw);
      const map = computeMobileQuotaMap(appState.archive, appState.bookings);
      return map[key] || {
        mobileKey: key,
        Speaking: 0,
        Reading: 0,
        Listening: 0,
        Writing: 0,
        totalUsed: 0
      };
    }

    function normalizeDriveImageUrl(rawUrl) {
      const url = String(rawUrl || '').trim();
      if (!url) return '';
      const fileMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileMatch && fileMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${fileMatch[1]}`;
      }
      const idMatch = url.match(/drive\.google\.com\/(?:open|uc)\?[^#]*id=([a-zA-Z0-9_-]+)/);
      if (idMatch && idMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
      }
      return url;
    }

    function buildDefaultModuleBatches(batches) {
      const list = Array.isArray(batches) ? [...batches] : [...DEFAULT_BATCHES];
      return {
        Speaking: [...list],
        Reading: [...list],
        Listening: [...list],
        Writing: [...list]
      };
    }

    function normalizeModuleBatches(rawObj, validBatches) {
      const base = buildDefaultModuleBatches(validBatches);
      if (!rawObj || typeof rawObj !== 'object') return base;
      const result = {};
      ALL_MODULE_KEYS.forEach(mod => {
        if (Array.isArray(rawObj[mod])) {
          result[mod] = rawObj[mod].map(String).filter(b => validBatches.includes(b));
        } else {
          result[mod] = [...validBatches];
        }
      });
      return result;
    }

    function normalizeBookingWindow(raw) {
      if (!raw || typeof raw !== 'object') return { ...DEFAULT_BOOKING_WINDOW };
      const startDate = /^\d{4}-\d{2}-\d{2}$/.test(String(raw.startDate || ''))
        ? String(raw.startDate)
        : DEFAULT_BOOKING_WINDOW.startDate;
      const endDate = /^\d{4}-\d{2}-\d{2}$/.test(String(raw.endDate || ''))
        ? String(raw.endDate)
        : startDate;
      return {
        enabled: raw.enabled === undefined ? true : Boolean(raw.enabled),
        startDate,
        startTime: /^\d{2}:\d{2}$/.test(String(raw.startTime || '')) ? String(raw.startTime) : DEFAULT_BOOKING_WINDOW.startTime,
        endDate,
        endTime: /^\d{2}:\d{2}$/.test(String(raw.endTime || '')) ? String(raw.endTime) : DEFAULT_BOOKING_WINDOW.endTime
      };
    }

    function format24To12(hhmm) {
      const [hStr, mStr] = String(hhmm || '15:00').split(':');
      let h = parseInt(hStr, 10);
      const m = String(mStr || '00').padStart(2, '0');
      if (isNaN(h)) return hhmm;
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      return `${h}:${m} ${ampm}`;
    }

    function formatDateWithDay(isoDate) {
      const [y, m, d] = String(isoDate || '').split('-').map(Number);
      if (!y || !m || !d) return isoDate || '';
      const dt = new Date(y, m - 1, d);
      const dayName = DAYS_OF_WEEK[dt.getDay()];
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${dayName}, ${monthNames[m - 1]} ${d}, ${y}`;
    }

    function parseLocalDateTime(isoDate, hhmm) {
      const [y, m, d] = String(isoDate || '').split('-').map(Number);
      const [hh, mm] = String(hhmm || '00:00').split(':').map(Number);
      if (!y || !m || !d) return null;
      return new Date(y, m - 1, d, hh || 0, mm || 0, 0, 0);
    }

    function getBookingWindowStatus(win = appState.bookingWindow) {
      const cfg = normalizeBookingWindow(win);
      const startStr = `${formatDateWithDay(cfg.startDate)} (${format24To12(cfg.startTime)})`;
      const endStr = cfg.startDate === cfg.endDate
        ? format24To12(cfg.endTime)
        : `${formatDateWithDay(cfg.endDate)} (${format24To12(cfg.endTime)})`;
      const label = `${startStr} – ${endStr}`;
      if (!cfg.enabled) {
        return { isOpen: true, enabled: false, label, startStr, endStr };
      }
      const startDt = parseLocalDateTime(cfg.startDate, cfg.startTime);
      const endDt = parseLocalDateTime(cfg.endDate, cfg.endTime);
      if (!startDt || !endDt) {
        return { isOpen: false, enabled: true, label, startStr, endStr };
      }
      const now = new Date();
      const isOpen = now.getTime() >= startDt.getTime() && now.getTime() <= endDt.getTime();
      return { isOpen, enabled: true, label, startStr, endStr };
    }

    function formatClockStr(raw) {
      const s = String(raw || '').trim();
      if (/1899-12-30/.test(s) || /T\d{2}:\d{2}/.test(s)) {
        const d = new Date(s);
        if (!isNaN(d.getTime())) {
          let h = d.getHours();
          const m = String(d.getMinutes()).padStart(2, '0');
          const ampm = h >= 12 ? 'PM' : 'AM';
          h = h % 12 || 12;
          return `${h}:${m} ${ampm}`;
        }
      }
      return s;
    }

    function formatTimestampShort(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function loadScriptUrl() {
      try {
        const saved = localStorage.getItem(STORAGE_URL_KEY);
        if (saved && saved.trim()) return saved.trim();
      } catch (e) {}
      return DEFAULT_SCRIPT_URL;

    function loadLocalDemoData() {
      try {
        const raw = localStorage.getItem(STORAGE_DEMO_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.slots) && Array.isArray(parsed.batches)) {
            const batches = parsed.batches;
            return {
              weekLabel: parsed.weekLabel || 'Current Week',
              slots: parsed.slots,
              batches,
              bookings: Array.isArray(parsed.bookings) ? parsed.bookings : [],
              archive: Array.isArray(parsed.archive) ? parsed.archive : [],
              accounts: Array.isArray(parsed.accounts) ? parsed.accounts : [],
              moduleBatches: normalizeModuleBatches(parsed.moduleBatches, batches),
              bookingWindow: normalizeBookingWindow(parsed.bookingWindow)
            };
          }
        }
      } catch (e) {}
      const init = {
        weekLabel: 'Current Week',
        slots: DEFAULT_SLOTS.map(s => ({ ...s })),
        batches: [...DEFAULT_BATCHES],
        bookings: [],
        archive: [],
        accounts: [],
        moduleBatches: buildDefaultModuleBatches(DEFAULT_BATCHES),
        bookingWindow: { ...DEFAULT_BOOKING_WINDOW }
      };
      saveLocalDemoData(init);
      return init;
    }

    function saveLocalDemoData(data) {
      try {
        localStorage.setItem(STORAGE_DEMO_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function saveLiveSnapshotCache(data) {
      try {
        const safeSnapshot = {
          weekLabel: data.weekLabel || 'Current Week',
          slots: data.slots || [],
          batches: data.batches || [],
          bookings: data.bookings || [],
          archive: data.archive || [],
          moduleBatches: data.moduleBatches || null,
          bookingWindow: data.bookingWindow || null
        };
        localStorage.setItem(STORAGE_LIVE_CACHE_KEY, JSON.stringify(safeSnapshot));
      } catch (e) {}
    }

    function loadLiveSnapshotCache() {
      try {
        const raw = localStorage.getItem(STORAGE_LIVE_CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.slots) && Array.isArray(parsed.batches)) {
          return parsed;
        }
      } catch (e) {}
      return null;
    }

    function loadSavedStudentSession() {
      try {
        const raw = localStorage.getItem(STORAGE_STUDENT_SESSION_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.username && parsed.mobileNumber && parsed.batch) {
          return parsed;

      return null;

    function saveStudentSession(acc) {

        if (!acc) localStorage.removeItem(STORAGE_STUDENT_SESSION_KEY);
        else localStorage.setItem(STORAGE_STUDENT_SESSION_KEY, JSON.stringify(acc));

    /*************************************************************************

    let pendingConfirmFn = null;

    function isLiveMode() {
      return Boolean(appState.scriptUrl && appState.scriptUrl.trim().startsWith('http'));
    }

    /*************************************************************************
     * 4. GOOGLE SHEETS SYNC API (WITH INSTANT LOCAL-FIRST HYDRATION)
     *************************************************************************/
    async function apiGetData() {
      const url = appState.scriptUrl.trim();
      const sep = url.includes('?') ? '&' : '?';
      let query = `${url}${sep}action=getData`;
      if (appState.adminAuthenticated && appState.adminPasswordInSession) {
        query += `&password=${encodeURIComponent(appState.adminPasswordInSession)}`;
      }
      const res = await fetch(query, { method: 'GET', redirect: 'follow' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (!json || !json.ok) throw new Error((json && json.error) || 'Failed to read sheet');
      return json;
    }

    async function apiPost(payload) {
      const res = await fetch(appState.scriptUrl.trim(), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        redirect: 'follow',
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (!json || !json.ok) throw new Error((json && json.error) || 'Request rejected');
      return json;
    }

    function applyServerPayload(data, { cacheLive = false } = {}) {
      appState.weekLabel = data.weekLabel || 'Current Week';
      appState.slots = (data.slots || []).map(s => ({
        id: String(s.id),
        module: String(s.module),
        day: String(s.day),
        time: formatClockStr(s.time),
        capacity: Number(s.capacity) || 1,
        active: Boolean(s.active)
      }));
      appState.batches = (data.batches || []).map(String);
      appState.bookings = (data.bookings || []).map(b => ({
        ...b,
        time: formatClockStr(b.time),
        mobileNumber: String(b.mobileNumber || '').trim()
      }));
      appState.archive = (data.archive || []).map(a => ({
        ...a,
        time: formatClockStr(a.time),
        mobileNumber: String(a.mobileNumber || '').trim()
      }));
      if (Array.isArray(data.accounts)) {
        appState.accounts = data.accounts.map(ac => ({
          accountId: String(ac.accountId || ''),
          fullName: String(ac.fullName || '').trim(),
          username: String(ac.username || '').trim(),
          password: String(ac.password || '').trim(),
          mobileNumber: String(ac.mobileNumber || '').trim(),
          batch: String(ac.batch || '').trim(),
          createdAt: String(ac.createdAt || ''),
          status: String(ac.status || '').trim() || 'Approved'
        }));
      }
      appState.moduleBatches = normalizeModuleBatches(data.moduleBatches, appState.batches);
      appState.bookingWindow = normalizeBookingWindow(data.bookingWindow);

      appState.draftSlots = appState.slots.map(s => ({ ...s }));
      appState.draftBatches = [...appState.batches];
      appState.draftModuleBatches = normalizeModuleBatches(appState.moduleBatches, appState.batches);

      if (appState.loggedInAccount) {
        appState.studentName = appState.loggedInAccount.fullName;
        appState.mobileNumber = appState.loggedInAccount.mobileNumber;
        appState.selectedBatch = appState.loggedInAccount.batch;
      }

      if (appState.selectedBatch && !appState.batches.includes(appState.selectedBatch)) {
        appState.selectedBatch = '';
      }
      ALL_MODULE_KEYS.forEach(mod => {
        const pickedId = appState.selectedByModule[mod];
        if (pickedId) {
          const sl = appState.slots.find(s => s.id === pickedId && s.active);
          if (!sl || getSeatsLeft(sl) <= 0) {
            appState.selectedByModule[mod] = null;
          }
        }
      });

      if (cacheLive && isLiveMode()) {
        saveLiveSnapshotCache(data);
      }
    }

    async function syncAllData({ silent = false } = {}) {
      appState.isSyncing = true;
      updateHeaderChrome();

      if (!isLiveMode()) {
        const demo = loadLocalDemoData();
        applyServerPayload(demo);
        appState.isLiveConnected = false;
        appState.isSyncing = false;
        renderApp({ preserveScroll: true });
        if (!silent) showToast('Refreshed local data.', 'info');
        return;
      }

      // Hydrate immediately from cached snapshot on cold start so UI renders in 0ms
      if (appState.slots.length === 0) {
        const cachedSnapshot = loadLiveSnapshotCache();
        if (cachedSnapshot) {
          applyServerPayload(cachedSnapshot);
          renderApp({ preserveScroll: true });
        }
      }

      try {
        const data = await apiGetData();
        applyServerPayload(data, { cacheLive: true });
        appState.isLiveConnected = true;
        if (!silent) showToast('Synced live with Google Sheet.', 'success');
      } catch (err) {
        appState.isLiveConnected = false;
        if (appState.slots.length === 0) {
          applyServerPayload(loadLocalDemoData());
        }
        if (!silent) showToast(`Sync error: ${err.message}`, 'error');
      } finally {
        appState.isSyncing = false;
        renderApp({ preserveScroll: true });
      }
    }

    function handleManualSync() {
      if (!appState.isSyncing) syncAllData({ silent: false });
    }

    /*************************************************************************
     * 5. SEAT COUNT & QUOTA LOGIC
     *************************************************************************/
    function getSlotTakenCount(slotId) {
      return appState.bookings.filter(b => b.slotId === slotId).length;
    }

    function getSeatsLeft(slot) {
      return Math.max(0, (Number(slot.capacity) || 0) - getSlotTakenCount(slot.id));
    }

    function isBatchAllowedForModule(batch, moduleKey) {
      if (!batch) return false;
      const allowedList = appState.moduleBatches[moduleKey] || [];
      return allowedList.includes(batch);
    }

    function renderMobileQuotaBreakdownHtml(mobileRaw) {
      const normalized = normalizeMobileKey(mobileRaw);
      if (normalized.length < 11) return '';
      const usage = getStudentMobileUsage(mobileRaw);
      const totalLeft = Math.max(0, MAX_TOTAL_MODULES - usage.totalUsed);
      const bookedThisWeek = hasBookedThisWeek(mobileRaw);

      return `
        <div class="quota-box">
          ${bookedThisWeek ? `
            <div style="padding:8px 10px;border-radius:8px;background:#fff1f2;border:1px solid #fecdd3;color:#be123c;font-size:11px;font-weight:700;">
              ⚠️ Weekly Limit Reached: This number has already booked for ${escapeHtml(appState.weekLabel)}.
            </div>
          ` : ''}
          <div class="quota-header">
            <span style="font-weight:700;color:#334155;">Remaining Tests for ${escapeHtml(mobileRaw.trim())}</span>
            <span style="font-weight:800;color:${totalLeft === 0 ? '#e11d48' : '#0A6C82'};">${totalLeft}/${MAX_TOTAL_MODULES} Total Left</span>
          </div>
          <div class="quota-grid">
            ${ALL_MODULE_KEYS.map(mod => {
              const used = usage[mod] || 0;
              const left = Math.max(0, MAX_PER_MODULE - used);
              const cls = left === 0 ? 'zero' : left === 1 ? 'warn' : '';
              return `
                <div class="quota-cell ${cls}">
                  <div style="font-size:10px;font-weight:700;color:#64748b;">${mod}</div>
                  <div style="font-size:12px;font-weight:800;">${left}/${MAX_PER_MODULE} left</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function updateMobileQuotaPreview() {
      const container = document.getElementById('mobile-quota-preview');
      if (container) {
        container.innerHTML = renderMobileQuotaBreakdownHtml(appState.mobileNumber);
      }
    }

    /*************************************************************************
     * 6. CENTER-SCREEN NOTIFICATION & CONFIRM MODAL
     *************************************************************************/
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      container.innerHTML = '';

      const iconMap = {
        success: '✅',
        error: '⚠️',
        info: 'ℹ️'
      };

      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.innerHTML = `
        <div class="toast-badge">${iconMap[type] || '✅'}</div>
        <div>${escapeHtml(message)}</div>
      `;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'scale(0.95)';
        el.style.transition = 'opacity 0.25s, transform 0.25s';
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    function openConfirmModal({ title, message, confirmText = 'Confirm', onConfirm }) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').textContent = message;
      document.getElementById('modal-confirm-btn').textContent = confirmText;
      pendingConfirmFn = onConfirm;
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').classList.add('hidden');
      pendingConfirmFn = null;
    }

    document.getElementById('modal-cancel-btn').addEventListener('click', closeConfirmModal);
    document.getElementById('modal-confirm-btn').addEventListener('click', () => {
      const fn = pendingConfirmFn;
      closeConfirmModal();

    async function handleStudentSignup(e) {
      if (e) e.preventDefault();
      if (appState.isAuthSubmitting) return;

      const fullName = (document.getElementById('signup-name')?.value || '').trim();
      const username = (document.getElementById('signup-username')?.value || '').trim();
      const password = (document.getElementById('signup-password')?.value || '').trim();
      const mobileNumber = (document.getElementById('signup-mobile')?.value || '').trim();
      const batch = (document.getElementById('signup-batch')?.value || '').trim();

      if (!fullName || !username || !password || !mobileNumber || !batch) {
        showToast('Please fill in Full Name, Username, Password, Mobile Number, and Batch.', 'error');
        return;
      }
      if (username.length < 3) {
        showToast('Username must be at least 3 characters.', 'error');
        return;
      }
      if (password.length < 4) {
        showToast('Password must be at least 4 characters.', 'error');
        return;
      }
      if (normalizeMobileKey(mobileNumber).length < 11) {
        showToast('Please enter a valid 11-digit mobile number.', 'error');
        return;
      }

      appState.isAuthSubmitting = true;
      renderApp({ preserveScroll: true });

      try {
        let accountObj = null;
        let isPending = false;
        if (isLiveMode()) {
          const res = await apiPost({
            action: 'studentSignup',
            fullName,
            username,
            password,
            mobileNumber,
            batch
          });
          accountObj = res.account;
          isPending = Boolean(res.pendingApproval) || String(accountObj?.status || '').toLowerCase() === 'pending';
          applyServerPayload(res, { cacheLive: true });
        } else {
          const demo = loadLocalDemoData();
          const unameLower = username.toLowerCase();
          const mKey = normalizeMobileKey(mobileNumber);

          if ((demo.accounts || []).some(a => String(a.username || '').trim().toLowerCase() === unameLower)) {
            throw new Error('Username already exists, please choose a different username.');
          }
          if ((demo.accounts || []).some(a => normalizeMobileKey(a.mobileNumber) === mKey)) {
            throw new Error('An account already exists for this mobile number. Please log in instead.');
          }

          accountObj = {
            accountId: 'ACC-' + Date.now().toString(36).toUpperCase(),
            fullName,
            username,
            password,
            mobileNumber,
            batch,
            createdAt: new Date().toISOString(),
            status: 'Pending'
          };
          isPending = true;
          demo.accounts = (demo.accounts || []).concat([accountObj]);
          saveLocalDemoData(demo);
          applyServerPayload(demo);
        }

        if (isPending) {
          appState.authMode = 'login';
          showToast(`Account Request Sent! Pending QC approval by your Batch ${batch} Teacher.`, 'info');
          return;
        }

        const safeSession = {
          accountId: accountObj.accountId,
          fullName: accountObj.fullName,
          username: accountObj.username,
          mobileNumber: accountObj.mobileNumber,
          batch: accountObj.batch
        };
        appState.loggedInAccount = safeSession;
        appState.studentTab = 'book';
        appState.studentName = safeSession.fullName;
        appState.mobileNumber = safeSession.mobileNumber;
        appState.selectedBatch = safeSession.batch;
        saveStudentSession(safeSession);

        showToast(`Account Created! Welcome, ${safeSession.fullName}.`, 'success');
      } catch (err) {
        showToast(err.message || 'Sign up failed.', 'error');
      } finally {
        appState.isAuthSubmitting = false;
        renderApp();
      }
    }

    function handleToggleSlot(moduleKey, slotId) {
      const slot = appState.slots.find(s => s.id === slotId && s.active);
      if (!slot) return;
      const winStatus = getBookingWindowStatus();
      if (!winStatus.isOpen) {
        showToast(`Booking closed. Open only during: ${winStatus.label}.`, 'error');
        return;
      }
      if (hasBookedThisWeek(appState.mobileNumber)) {
        showToast(`Weekly limit: This mobile number has already booked for ${appState.weekLabel}.`, 'error');
        return;
      }
      const usage = getStudentMobileUsage(appState.mobileNumber);
      if ((usage[moduleKey] || 0) >= MAX_PER_MODULE) {
        showToast(`Quota reached: You have already taken 4 ${moduleKey} tests.`, 'error');
        return;
      }
      if (getSeatsLeft(slot) <= 0 && appState.selectedByModule[moduleKey] !== slotId) {
        showToast('This slot is completely full.', 'error');
        return;
      }
      appState.selectedByModule[moduleKey] =
        appState.selectedByModule[moduleKey] === slotId ? null : slotId;
      renderApp({ preserveScroll: true });
    }

    async function handleStudentSubmit(e) {
      if (e) e.preventDefault();
      if (appState.isSubmitting) return;

      const winStatus = getBookingWindowStatus();
      if (!winStatus.isOpen) {
        showToast(`Booking is currently closed. Booking timeline: ${winStatus.label}.`, 'error');
        return;
      }

      const studentName = appState.studentName.trim();
      const mobileNumber = appState.mobileNumber.trim();
      const batch = appState.selectedBatch;
      const chosenSlotIds = ALL_MODULE_KEYS
        .map(m => appState.selectedByModule[m])
        .filter(Boolean);

      if (!studentName) {
        showToast('Please enter your Full Name.', 'error');
        return;
      }
      if (!normalizeMobileKey(mobileNumber)) {
        showToast('Please enter a valid Mobile Number.', 'error');
        return;
      }
      if (hasBookedThisWeek(mobileNumber)) {
        showToast(`Weekly limit: This mobile number has already submitted a booking for ${appState.weekLabel}.`, 'error');
        return;
      }
      if (!batch) {
        showToast('Please select your Batch.', 'error');
        return;
      }
      if (chosenSlotIds.length === 0) {
        showToast('Please choose at least one test slot.', 'error');
        return;
      }

      const usage = getStudentMobileUsage(mobileNumber);
      for (let i = 0; i < ALL_MODULE_KEYS.length; i++) {
        const mod = ALL_MODULE_KEYS[i];
        if (appState.selectedByModule[mod] && (usage[mod] || 0) >= MAX_PER_MODULE) {
          showToast(`Quota limit: Maximum 4 attempts allowed for ${mod}.`, 'error');
          return;
        }
      }

      appState.isSubmitting = true;
      renderApp({ preserveScroll: true });

      try {
        if (isLiveMode()) {
          const updated = await apiPost({
            action: 'submitBooking',
            studentName,
            mobileNumber,
            batch,
            slotIds: chosenSlotIds
          });
          applyServerPayload(updated, { cacheLive: true });
        } else {
          const demo = loadLocalDemoData();
          const now = new Date().toISOString();
          chosenSlotIds.forEach((sid, idx) => {
            const sl = demo.slots.find(s => s.id === sid);
            if (sl) {
              demo.bookings.push({
                bookingId: `BK-${Date.now().toString(36).toUpperCase()}-${idx + 1}`,
                weekLabel: demo.weekLabel,
                timestamp: now,
                studentName,
                mobileNumber,
                batch,
                module: sl.module,
                slotId: sl.id,
                day: sl.day,
                time: sl.time
              });
            }
          });
          saveLocalDemoData(demo);
          applyServerPayload(demo);
        }

        appState.selectedByModule = { Speaking: null, Reading: null, Listening: null, Writing: null };
        showToast('Booking Done! Your Partial Test slots are confirmed.', 'success');
      } catch (err) {
        showToast(err.message || 'Booking failed. Please try again.', 'error');
      } finally {
        appState.isSubmitting = false;
        renderApp({ preserveScroll: true });
      }
    }

    async function handleReviewAccount(accountId, decision) {
      const target = (appState.accounts || []).find(a => a.accountId === accountId);
      if (!target) return;

      const executeReview = async () => {
        try {
          if (isLiveMode()) {
            const updated = await apiPost({
              action: 'reviewAccount',
              password: appState.adminPasswordInSession,
              accountId,
              decision
            });
            applyServerPayload(updated, { cacheLive: true });
          } else {
            const demo = loadLocalDemoData();
            if (decision === 'approve') {
              demo.accounts = (demo.accounts || []).map(a =>
                a.accountId === accountId ? { ...a, status: 'Approved' } : a
              );
            } else {
              demo.accounts = (demo.accounts || []).filter(a => a.accountId !== accountId);
            }
            saveLocalDemoData(demo);
            applyServerPayload(demo);
          }
          showToast(
            decision === 'approve'
              ? `Approved ${target.fullName} (Batch ${target.batch})!`
              : `Rejected & removed ${target.fullName}'s request.`,
            decision === 'approve' ? 'success' : 'info'
          );
          renderApp({ preserveScroll: true });
        } catch (err) {
          showToast(`Action failed: ${err.message}`, 'error');
        }
      };

      if (decision === 'reject') {
        openConfirmModal({
          title: 'Reject Account Request?',
          message: `Reject and delete the sign-up request from ${target.fullName} (${target.mobileNumber}, Batch ${target.batch})?`,
          confirmText: 'Reject Request',
          onConfirm: executeReview
        });
      } else {
        await executeReview();
      }
    }

      const startTimeEl = document.getElementById('settings-window-start-time');

        startDate: startDateEl ? startDateEl.value : DEFAULT_BOOKING_WINDOW.startDate,
        startTime: startTimeEl ? startTimeEl.value : DEFAULT_BOOKING_WINDOW.startTime,
        endDate: endDateEl ? endDateEl.value : DEFAULT_BOOKING_WINDOW.endDate,
        endTime: endTimeEl ? endTimeEl.value : DEFAULT_BOOKING_WINDOW.endTime
      });

      const startDt = parseLocalDateTime(nextWin.startDate, nextWin.startTime);
      const endDt = parseLocalDateTime(nextWin.endDate, nextWin.endTime);
      if (!startDt || !endDt || endDt.getTime() <= startDt.getTime()) {
        showToast('End date & time must be later than start date & time.', 'error');
        return;
      }

      try {
        if (isLiveMode()) {
          const updated = await apiPost({
            action: 'saveBookingWindow',
            password: appState.adminPasswordInSession,
            bookingWindow: nextWin
          });
          applyServerPayload(updated, { cacheLive: true });
        } else {
          const demo = loadLocalDemoData();
          demo.bookingWindow = nextWin;
          saveLocalDemoData(demo);
          applyServerPayload(demo);
        }
        showToast('Saved! Booking Timeline Window Updated.', 'success');
        renderApp({ preserveScroll: true });
      } catch (err) {

    }

    function downloadCsvFallback(rows, filename) {
      const headers = Object.keys(rows[0] || { Info: '' });
      const csvLines = [
        headers.join(','),
        ...rows.map(r => headers.map(h => `"${String(r[h] ?? '').replace(/"/g, '""')}"`).join(','))
      ];
      const blob = new Blob([csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function handleExportMultiSheetExcel() {
      const quotaMap = computeMobileQuotaMap(appState.archive, appState.bookings);
      const quotaRows = Object.values(quotaMap)
        .sort((a, b) => b.totalUsed - a.totalUsed)
        .map(q => ({
          'Mobile Number': q.mobileDisplay || q.mobileKey,
          'Student Name': q.studentName,
          'Batch': q.batch,
          'Speaking Used': q.Speaking,
          'Speaking Left': Math.max(0, MAX_PER_MODULE - q.Speaking),
          'Reading Used': q.Reading,
          'Reading Left': Math.max(0, MAX_PER_MODULE - q.Reading),
          'Listening Used': q.Listening,
          'Listening Left': Math.max(0, MAX_PER_MODULE - q.Listening),
          'Writing Used': q.Writing,
          'Writing Left': Math.max(0, MAX_PER_MODULE - q.Writing),
          'Total Used (Max 16)': q.totalUsed,
          'Total Left': Math.max(0, MAX_TOTAL_MODULES - q.totalUsed)
        }));

      const archiveRows = appState.archive.map(a => ({
        'Booking ID': a.bookingId,
        'Week': a.weekLabel,
        'Student Name': a.studentName,
        'Mobile Number': a.mobileNumber,
        'Batch': a.batch,
        'Module': a.module,
        'Day': a.day,
        'Time': a.time,
        'Booked At': a.timestamp,
        'Archived At': a.archivedAt
      }));

      const currentRows = appState.bookings.map(b => ({
        'Booking ID': b.bookingId,
        'Week': b.weekLabel,
        'Student Name': b.studentName,
        'Mobile Number': b.mobileNumber,
        'Batch': b.batch,
        'Module': b.module,
        'Day': b.day,
        'Time': b.time,
        'Booked At': b.timestamp
      }));

      const safeWeek = String(appState.weekLabel || 'Current_Week').replace(/[^a-zA-Z0-9_-]+/g, '_');

      if (typeof XLSX === 'undefined') {
        downloadCsvFallback(
          currentRows.length ? currentRows : [{ Info: 'No bookings this week' }],
          `AIMS_IELTS_Partial_Test_${safeWeek}.csv`
        );
        showToast('Downloaded CSV report (offline fallback).', 'info');
        return;
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(
        wb,
        XLSX.utils.json_to_sheet(quotaRows.length ? quotaRows : [{ Info: 'No mobile records yet' }]),
        'Quota Ledger (4-Module)'
      );
      XLSX.utils.book_append_sheet(
        wb,
        XLSX.utils.json_to_sheet(archiveRows.length ? archiveRows : [{ Info: 'Archive is empty' }]),
        'Archive Database'
      );
      XLSX.utils.book_append_sheet(
        wb,
        XLSX.utils.json_to_sheet(currentRows.length ? currentRows : [{ Info: 'No bookings this week' }]),
        'Current Week'
      );

      ALL_MODULE_KEYS.forEach(mod => {
        const modRows = appState.bookings
          .filter(b => b.module === mod)
          .map(b => ({
            'Student Name': b.studentName,
            'Mobile Number': b.mobileNumber,
            'Batch': b.batch,
            'Day': b.day,
            'Time': b.time,
            'Booking ID': b.bookingId
          }));
        XLSX.utils.book_append_sheet(
          wb,
          XLSX.utils.json_to_sheet(modRows.length ? modRows : [{ Info: `No ${mod} bookings this week` }]),
          mod
        );
      });

      XLSX.writeFile(wb, `AIMS_IELTS_Partial_Test_${safeWeek}.xlsx`);
      showToast('Multi-Sheet Excel Database Downloaded!', 'success');
    }

    function renderRosterBookingsListHtml() {
      const q = appState.rosterSearch.trim().toLowerCase();
      const filtered = appState.bookings.filter(b => {
        if (appState.rosterModuleFilter !== 'All' && b.module !== appState.rosterModuleFilter) return false;
        if (q && !b.studentName.toLowerCase().includes(q) && !b.batch.toLowerCase().includes(q) && !(b.mobileNumber || '').toLowerCase().includes(q)) return false;
        return true;
      });

      if (filtered.length === 0) {
        return `<p style="font-size:12px;color:#94a3b8;text-align:center;padding:16px;">No bookings found.</p>`;
      }

      return `
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${filtered.map(b => `
            <div class="list-item">
              <div>
                <p style="font-size:13px;font-weight:700;color:#0f172a;">${escapeHtml(b.studentName)} <span style="font-size:10px;padding:2px 6px;border-radius:4px;background:#e2e8f0;color:#334155;">Batch ${escapeHtml(b.batch)}</span></p>
                <p style="font-size:11px;color:#0A6C82;font-weight:600;">${escapeHtml(b.mobileNumber || 'No Mobile')}</p>
                <p style="font-size:11px;color:#64748b;">${escapeHtml(b.module)} • ${escapeHtml(b.day)} (${escapeHtml(b.time)})</p>
              </div>
              <button
                type="button"
                onclick="requestDeleteBooking('${b.bookingId}')"
                class="btn btn-xs"
                style="background:#fff1f2;color:#e11d48;"
              >
                Remove
              </button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderAccountsRecoveryListHtml() {
      const accQ = appState.accountSearch.trim().toLowerCase();
      const filteredAccounts = (appState.accounts || []).filter(ac => {
        if (!accQ) return true;
        return (
          String(ac.mobileNumber || '').toLowerCase().includes(accQ) ||
          String(ac.username || '').toLowerCase().includes(accQ) ||
          String(ac.fullName || '').toLowerCase().includes(accQ) ||
          String(ac.batch || '').toLowerCase().includes(accQ)
        );
      });

      if (filteredAccounts.length === 0) {
        return `<p style="font-size:12px;color:#94a3b8;text-align:center;padding:8px;">No student accounts match your search.</p>`;
      }

      return `
        <div style="display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;">
          ${filteredAccounts.map(ac => {
            const isPending = String(ac.status || 'Approved').toLowerCase() === 'pending';
            return `
            <div style="padding:10px;border-radius:12px;background:#f8fafc;border:1px solid ${isPending ? '#fde68a' : '#e2e8f0'};font-size:11px;display:flex;flex-direction:column;gap:4px;">
              <div class="flex-between">
                <span style="font-weight:700;color:#0f172a;">${escapeHtml(ac.fullName)} <span style="font-size:10px;padding:1px 6px;border-radius:4px;background:#e2e8f0;">Batch ${escapeHtml(ac.batch)}</span> <span style="font-size:9px;padding:1px 6px;border-radius:9999px;font-weight:800;background:${isPending ? '#fef3c7' : '#d1fae5'};color:${isPending ? '#b45309' : '#065f46'};">${isPending ? 'Pending QC' : 'Approved'}</span></span>
                <span style="font-weight:700;color:#0A6C82;">${escapeHtml(ac.mobileNumber)}</span>
              </div>
              <div class="flex-between" style="background:#ffffff;padding:6px 8px;border-radius:8px;border:1px solid #e2e8f0;">
                <span>User: <strong style="color:#0f172a;">${escapeHtml(ac.username)}</strong></span>
                <span>Pass: <strong style="color:#be123c;">${escapeHtml(ac.password || '••••')}</strong></span>
              </div>
            </div>
          `;
          }).join('')}
        </div>
      `;
    }

    function renderArchiveQuotaLedgerHtml() {
      const quotaMap = computeMobileQuotaMap(appState.archive, appState.bookings);
      const quotaList = Object.values(quotaMap).sort((a, b) => b.totalUsed - a.totalUsed);

      if (quotaList.length === 0) {
        return `<p style="font-size:12px;color:#94a3b8;text-align:center;padding:8px;">No student mobile history recorded yet.</p>`;
      }

      return `
        <div style="display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;">
          ${quotaList.map(item => `
            <div style="padding:10px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:11px;">
              <div class="flex-between" style="margin-bottom:6px;">
                <span style="font-weight:700;color:#0f172a;">${escapeHtml(item.mobileDisplay || item.mobileKey)} ${item.studentName ? `• ${escapeHtml(item.studentName)}` : ''}</span>
                <span style="font-weight:700;color:#0A6C82;">${item.totalUsed}/16</span>
              </div>
              <div class="quota-grid">
                ${ALL_MODULE_KEYS.map(m => {
                  const used = item[m] || 0;
                  return `<span style="padding:2px 4px;border-radius:6px;text-align:center;font-weight:700;background:${used >= MAX_PER_MODULE ? '#ffe4e6' : '#fff'};color:${used >= MAX_PER_MODULE ? '#be123c' : '#475569'};border:1px solid #e2e8f0;">${m[0]}: ${used}/4</span>`;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function updateRosterListDOM() {
      const el = document.getElementById('roster-bookings-list');
      if (el) el.innerHTML = renderRosterBookingsListHtml();
    }

    function updateAccountsListDOM() {
      const el = document.getElementById('accounts-recovery-list');
      if (el) el.innerHTML = renderAccountsRecoveryListHtml();
    }

    function renderApp({ preserveScroll = false } = {}) {
      const main = document.getElementById('main-content');
      const prevScroll = preserveScroll && main ? main.scrollTop : 0;

      updateHeaderChrome();

      if (appState.view === 'student') {
        main.innerHTML = renderStudentView();
      } else if (appState.view === 'login') {
        main.innerHTML = renderLoginView();
      } else {
        main.innerHTML = renderAdminView();
      }

      if (preserveScroll && main) {
        main.scrollTop = prevScroll;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderBrandLogo();
      syncAllData({ silent: true });
    });
  </script>
</body>
</html>
